  <script src="cordova.js"></script>
  <script>
    document.addEventListener('deviceready', () => {
      console.log('✅ Device ready');

      // Kiểm tra plugin
      if (!cordova?.plugins?.notification?.local) {
        console.error('❌ Plugin Local Notification chưa được load');
        return;
      }

      const localNotif = cordova.plugins.notification.local;

      // --- Bước 1: Xin quyền (đặc biệt cần cho Android 13+) ---
      localNotif.hasPermission((has) => {
        if (!has) {
          localNotif.requestPermission((granted) => {
            console.log('🔔 Quyền thông báo:', granted);
            if (!granted) {
              alert('App cần quyền gửi thông báo để hoạt động.');
              return;
            }
            scheduleNotification();
          });
        } else {
          scheduleNotification();
        }
      });

      // --- Bước 2: Hàm schedule 1 notification ---
      function scheduleNotification() {
        console.log('📅 Scheduling notification...');
        localNotif.schedule({
          id: 1,
          title: '🌾 Nhắc nhiệm vụ',
          text: 'Vào farm thu hoạch nào!',
          trigger: { in: 1, unit: 'minute' }, // 1 phút sau
          sound: true,
          smallIcon: 'res://ic_stat_notify', // phải tồn tại trong res/drawable
          foreground: true, // hiển thị cả khi app đang mở
          vibrate: true
        });
      }

      // --- Bước 3: Lắng nghe sự kiện ---
      localNotif.on('trigger', (notification) => {
        console.log('⏰ Notification triggered:', notification);
      });

      localNotif.on('click', (notification) => {
        console.log('👆 User clicked:', notification);
        alert('Bạn vừa nhấn vào thông báo: ' + notification.title);
      });
    });

    let interstitial

    document.addEventListener('deviceready', async () => {
      await admob.start()

      admob.configure({
        testDeviceIds: ['7a249b39-efe7-4dd4-a903-291448390a67'],
      })

      interstitial = new admob.InterstitialAd({
        adUnitId: 'ca-app-pub-3940256099942544/1033173712',
      })

      interstitial.on('load', (evt) => {
        // evt.ad
      })

      await interstitial.load()
      await interstitial.show()
    }, false)

    document.addEventListener('admob.ad.dismiss', async () => {
      // Once a interstitial ad is shown, it cannot be shown again.
      // Starts loading the next interstitial ad as soon as it is dismissed.
      await interstitial.load()
    })
