  <script>document.addEventListener('deviceready', () => {
      if (!cordova?.plugins?.notification?.local) {
        console.error('❌ Plugin Local Notification chưa được load');
        return;
      }

      const localNotif = cordova.plugins.notification.local;

      localNotif.hasPermission((has) => {
        if (!has) {
          localNotif.requestPermission((granted) => {
            console.error('🔔 Quyền thông báo:', granted);
            if (!granted) {
              alert('App cần quyền gửi thông báo để hoạt động.');
              return;
            }
            scheduleNotification();
          });
        } else {
          scheduleNotification();
        }
      });

      function scheduleNotification() {
        console.log('📅 Scheduling notification...');
        localNotif.schedule({
          id: 1,
          title: 'Nhắc nhiệm vụ',
          text: 'Thủy Tinh đã quay trở lại! Chuẩn bị chiến đấu ngay.',
          trigger: { in: 1, unit: 'minute' },
          sound: true,
          smallIcon: 'res://ic_stat_notify',
          foreground: true,
          vibrate: true
        });
      }

      localNotif.on('trigger', (notification) => {
        console.log('⏰ Notification triggered:', notification);
      });

      localNotif.on('click', (notification) => {
        console.log('👆 User clicked:', notification);
      });
    });

    let interstitial

    document.addEventListener('deviceready', async () => {
      await admob.start()

      interstitial = new admob.InterstitialAd({
        adUnitId: 'ca-app-pub-3940256099942544/1033173712',
      })

      interstitial.on('load', (evt) => {

      })

      await interstitial.load()
      await interstitial.show()
    }, false)

    document.addEventListener('admob.ad.dismiss', async () => {
      await interstitial.load()
    })
